<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Measurement Plugin</title>
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        :root {
            --bg-main: #f4f3ef;
            --bg-panel: #ffffff;
            --color-green: #62b55f;
            --color-blue: #4472c4;
            --color-gray: #a6a6a6;
            --color-light-gray: #e9e9e9;
            --text-dark: #333333;
            --text-muted: #6b6b6b;
            --border-radius: 8px;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 12px; }
        body { 
        background-color: var(--bg-main); 
        margin: 0; 
        padding: 8px 15px; 
        color: var(--text-dark); 
    }

        /* --- TABS NAVIGASI --- */
        #header { display: flex; background: var(--bg-panel); border-radius: var(--border-radius); padding: 4px; margin-bottom: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .tab-btn { flex: 1; padding: 10px 0; border: none; background: transparent; font-weight: 700; color: var(--color-gray); border-radius: 6px; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { background-color: var(--color-green); color: white; }

        /* --- PANEL UMUM --- */
        .panel {
        background-color: var(--bg-panel);
        border-radius: var(--border-radius);
        padding: 10px 15px;
        margin-bottom: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .panel-row {
        display: flex;
        gap: 15px;
        margin-bottom: 8px;
    }
        .panel-col { flex: 1; }
        .section-title { text-align: center; font-weight: 700; margin-top: 0; margin-bottom: 10px; color: var(--text-muted); text-transform: uppercase; }

        /* --- SIDES (KIRI) --- */
       /* --- SIDES (KIRI) --- */
.sides-grid {
    display: grid;
    grid-template-columns: 40px 40px;
    grid-template-rows: 40px 40px;
    gap: 8px;
    justify-content: center;
    align-content: center;
    width: 100%;
    margin: 0;
}

.sides-grid > div {
    width: 40px;
    height: 40px;
}

.side-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    background-color: var(--color-light-gray);
    border-radius: var(--border-radius);
    cursor: pointer;
    transition: 0.2s;
}
        .side-btn { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; background-color: var(--color-light-gray); border-radius: var(--border-radius); cursor: pointer; transition: 0.2s; }
        .sides-grid input[type="checkbox"] { display: none; }
        .sides-grid input[type="checkbox"]:checked + .side-btn { background-color: var(--color-green); }
        .arrow-up { width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 10px solid white; }
        .arrow-down { width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 10px solid white; }
        .arrow-left { width: 0; height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-right: 10px solid white; }
        .arrow-right { width: 0; height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-left: 10px solid white; }

        /* --- OPTIONS (KANAN) --- */
        .options-grid { display: flex; flex-direction: column; gap: 10px; }
        .line-style-group { display: flex; gap: 5px; }
        .line-style-group input[type="radio"] { display: none; }
        .line-style-btn { flex: 1; height: 30px; background-color: var(--color-gray); border-radius: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; transition: 0.2s; }
        .line-style-group input[type="radio"]:checked + .line-style-btn { background-color: var(--color-green); }
        .text-unit-group { display: flex; gap: 10px; }
        .text-unit-group > div { flex: 1; }
        .blue-btn { width: 100%; background-color: var(--color-blue); color: white; border: none; padding: 8px 0; border-radius: 20px; font-weight: 700; cursor: pointer; transition: 0.2s; }

        /* --- SLIDERS --- */
        .slider-row { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .slider-row label { width: 70px; font-weight: 600; }
        .slider-row input[type="number"] { width: 45px; padding: 4px; border: 1px solid var(--color-light-gray); border-radius: 4px; text-align: center; font-weight: 600; }
        .slider-row input[type="range"] { flex: 1; -webkit-appearance: none; height: 6px; background: var(--color-light-gray); border-radius: 5px; outline: none; }
        .slider-row input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--color-green); cursor: pointer; }

        /* --- DROPDOWNS --- */
        .dropdown-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-weight: 600; }
        select, input[type="text"], input[type="number"] { padding: 8px; border: 1px solid var(--color-light-gray); border-radius: 4px; background-color: white; color: var(--text-dark); outline: none; width: 100%; }

        /* --- BUTTONS --- */
        .action-btn { width: 100%; background-color: var(--color-green); color: white; border: none; padding: 15px; border-radius: var(--border-radius); font-size: 14px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(98, 181, 95, 0.3); transition: 0.2s; }
        .action-btn:hover { background-color: #55a052; }
        .signature-footer {
        position: relative;
        text-align: center;
        font-size: 9px;
        color: var(--color-gray);
        margin-top: 8px;
        text-transform: uppercase;
    }

        /* Panel refresh trigger — dev-only, shown by js/main.js when dev.mode exists */
        .panel-refresh {
        display: none;
        position: absolute;
        left: 8px;
        top: 50%;
        transform: translateY(-50%);
        padding: 2px 6px;
        border: none;
        background: transparent;
        color: var(--color-gray);
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
    }
        .panel-refresh:hover { color: var(--color-green); }
        .mb-0 { margin-bottom: 0; }
        .full-width { grid-column: span 2; }
        

        /* --- SCALE MODE SWITCH --- */
        .scale-mode-switch { display: grid; grid-template-columns: 1fr 54px 1fr; align-items: center; gap: 10px; }
        .scale-mode-label { font-weight: 700; color: var(--color-gray); transition: 0.2s; }
        .scale-mode-label:last-child { text-align: right; }
        .scale-mode-label.active { color: var(--color-blue); }
        .switch { position: relative; display: inline-block; width: 54px; height: 28px; }
        .switch input { display: none; }
        .switch-track { position: absolute; inset: 0; background: var(--color-blue); border-radius: 20px; cursor: pointer; transition: 0.2s; }
        .switch-track:before { content: ""; position: absolute; width: 20px; height: 20px; left: 4px; top: 4px; background: white; border-radius: 50%; transition: 0.2s; }
        .switch input:checked + .switch-track { background: var(--color-gray); }
        .switch input:checked + .switch-track:before { transform: translateX(26px); }

        /* Iframe Calc */
       #calcPage {
            margin: -8px -15px 0 -15px;
        }

        #calcFrame {
            display: block;
            width: calc(100% + 30px);
            height: calc(100vh - 75px);
            border: none;
            margin: 0;
            padding: 0;
            background: transparent;
        }

.signature-name {
    margin-top: 4px;
    font-size: 8px;
    font-weight: bold;
}
    </style>
</head>
<body>
<div id="header">
    <button id="btnMeas" class="tab-btn active">MEAS</button>
    <button id="btnScale" class="tab-btn">SCALE</button>
    <button id="btnCalc" class="tab-btn">CALC</button>
</div>

<div id="content">

    <div id="measPage">
        <div class="panel-row">
            <div class="panel panel-col mb-0" style="flex: 0.6;">
                <h3 class="section-title">Sides</h3>
                <div class="sides-grid">
                    <div>
                        <input id="chkTop" type="checkbox" checked>
                        <label for="chkTop" class="side-btn"><div class="arrow-up"></div></label>
                    </div>
                    <div>
                        <input id="chkBottom" type="checkbox" checked>
                        <label for="chkBottom" class="side-btn"><div class="arrow-down"></div></label>
                    </div>
                    <div>
                        <input id="chkLeft" type="checkbox" checked>
                        <label for="chkLeft" class="side-btn"><div class="arrow-left"></div></label>
                    </div>
                    <div>
                        <input id="chkRight" type="checkbox" checked>
                        <label for="chkRight" class="side-btn"><div class="arrow-right"></div></label>
                    </div>
                </div>
            </div>

            <div class="panel panel-col mb-0">
                <h3 class="section-title">Options</h3>
                <div class="options-grid">
                    <div>
                        <div style="font-size: 10px; margin-bottom: 4px; color: var(--text-muted); font-weight: bold;">Line Style</div>
                        <div class="line-style-group">
                            <input type="radio" name="rdoLineStyle" id="lsArrow" value="arrow" checked>
                            <label for="lsArrow" class="line-style-btn">↔</label>
                            <input type="radio" name="rdoLineStyle" id="lsTick" value="tick">
                            <label for="lsTick" class="line-style-btn">├·┤</label>
                            <input type="radio" name="rdoLineStyle" id="lsSlanted" value="slanted">
                            <label for="lsSlanted" class="line-style-btn">\</label>
                        </div>
                    </div>
                    <div class="text-unit-group">
                        <div>
                            <div style="font-size: 10px; margin-bottom: 4px; color: var(--text-muted); font-weight: bold;">Text Style</div>
                            <button type="button" id="btnTextStyleToggle" class="blue-btn">LINEAR</button>
                        </div>
                        <div>
                            <div style="font-size: 10px; margin-bottom: 4px; color: var(--text-muted); font-weight: bold;">Output Unit</div>
                            <button type="button" id="btnUnitToggle" class="blue-btn">FEET</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Arrow Display</label>
                        <select id="ddlArrowTextMode">
                            <option value="dual" selected>Feet + Inches</option>
                            <option value="feet">Feet Only</option>
                            <option value="inch">Inches Only</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Metric Unit</label>
                        <select id="ddlMetricUnit">
                            <option value="mm" selected>Millimeters (mm)</option>
                            <option value="cm">Centimeters (cm)</option>
                            <option value="m">Meters (m)</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="panel">
            <div class="slider-row">
                <label>Offset</label>
                <input id="txtOffset" type="number" value="50" min="0">
                <input id="sldOffset" type="range" min="0" max="200" value="50">
            </div>
            <div class="slider-row mb-0">
                <label>Appearance</label>
                <input id="txtAppearance" type="number" value="100" min="0">
                <input id="sldAppearance" type="range" min="0" max="1000" value="100">
            </div>
        </div>

        <div class="panel">
            <div class="dropdown-grid">
                <div class="form-group">
                    <label>Format</label>
                    <select id="ddlNumFormat">
                        <option value="fraction" selected>Fraction</option>
                        <option value="decimal2">Decimal (.00)</option>
                        <option value="decimal3">Decimal (.000)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Precision</label>
                    <select id="ddlFraction">
                        <option>1/2</option><option>1/4</option><option selected>1/8</option>
                        <option>1/16</option><option>1/32</option><option>1/64</option>
                    </select>
                </div>
                <div class="form-group full-width">
                    <label>Scale</label>
                    <select id="ddlScale">
                        <option selected>Full Size</option>
                        <option>6" = 1'</option>
                        <option>3" = 1'</option>
                        <option>2" = 1'</option>
                        <option>1-1/2" = 1'</option>
                        <option>1" = 1'</option>
                        <option>3/4" = 1'</option>
                        <option>1/2" = 1'</option>
                        <option>3/8" = 1'</option>
                        <option>1/4" = 1'</option>
                        <option>3/16" = 1'</option>
                        <option>1/8" = 1'</option>
                        <option>3/32" = 1'</option>
                        <option>1/16" = 1'</option>
                    </select>
                </div>
                <div class="form-group full-width">
            <label>Custom Percentage (%)</label>
            <input
                id="txtMeasurePercent"
                type="number"
                placeholder="Fill percent manually, empty if use dropdown"
                min="0.01"
                step="0.01"
            >
        </div>
            </div>
        </div>
        
        <button id="btnMeasure" class="action-btn">Measure</button>
    </div>

    <div id="scalePage" style="display:none;">
        <div class="panel">
            <h3 class="section-title">Scale Settings</h3>
            <div class="form-group" style="margin-bottom: 15px;">
                <label>Select Scale Target</label>
                <select id="ddlScaleObj">
                        <option selected>Full Size</option>
                        <option>6" = 1'</option>
                        <option>3" = 1'</option>
                        <option>2" = 1'</option>
                        <option>1-1/2" = 1'</option>
                        <option>1" = 1'</option>
                        <option>3/4" = 1'</option>
                        <option>1/2" = 1'</option>
                        <option>3/8" = 1'</option>
                        <option>1/4" = 1'</option>
                        <option>3/16" = 1'</option>
                        <option>1/8" = 1'</option>
                        <option>3/32" = 1'</option>
                        <option>1/16" = 1'</option>
                    </select>
            </div>
            <div class="form-group" style="margin-bottom: 15px;">
                <label for="txtPercent">Custom Percentage (%)</label>
                <input id="txtPercent" type="number" placeholder="Fill percent manually, empty if use dropdown">
            </div>
            <div class="form-group">
                <label>Mode</label>
                <div class="scale-mode-switch">
                    <span id="lblApplyMode" class="scale-mode-label active">SCALE / DIVIDE</span>
                    <label class="switch">
                        <input type="checkbox" id="scaleModeSwitch">
                        <span class="switch-track"></span>
                    </label>
                    <span id="lblRestoreMode" class="scale-mode-label">RESTORE / MULTIPLY</span>
                </div>
            </div>
        </div>
        <button id="btnApplyScale" class="action-btn">Apply Scale</button>
    </div>

    <div id="calcPage" style="display:none;">
        <iframe id="calcFrame" src="KALKULATOR.html"></iframe>
    </div>

</div>

<div class="signature-footer">
    <button id="btnRefreshPanel" class="panel-refresh" title="Reload panel (dev)">&#8635;</button>
    Dev by
    <div class="signature-name">Khamid & Zaki</div>
</div>

<script src="js/CSInterface.js"></script>
<script src="js/main.js"></script>

</body>
</html>
